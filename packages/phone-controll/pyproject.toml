[project]
name = "mcp-phone-controll"
version = "0.21.0"
description = "MCP server for building, deploying and testing Flutter apps on real Android + iOS devices"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Michal Giza", email = "msquaregiza@gmail.com" }]
keywords = [
    "mcp",
    "model-context-protocol",
    "flutter",
    "android",
    "ios",
    "agent",
    "patrol",
    "appium",
    "claude",
    "anthropic",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
]

dependencies = [
    # Cap below 2.0. The mcp 2.0.0 SDK REMOVED the low-level decorator API
    # (`@server.list_tools()` / `@server.call_tool()`) that
    # presentation/mcp_server.py is built on, replacing it with constructor
    # callbacks (`Server(on_list_tools=..., on_call_tool=...)`). Verified
    # against a clean install of mcp==2.0.0: `Server` no longer exposes
    # `list_tools`/`call_tool` at all, so the server raises AttributeError
    # at boot. Without this cap a fresh `pip install mcp-phone-controll`
    # resolves 2.0.0 and every NEW user gets a server that cannot start.
    # Migrating to the 2.x callback API is tracked separately.
    # Floor is 1.29 (the last 1.x): 1.27.0 carries three HIGH advisories —
    # PYSEC-2026-3481/3482 (HTTP transports served session requests without
    # verifying the authenticated principal; task handlers let any client
    # read/cancel other clients' tasks; both fixed 1.27.2) and
    # PYSEC-2026-3483 (WebSocket transport lacked Host/Origin validation →
    # DNS rebinding; fixed 1.28.1). The old >=1.2.0 floor also admitted
    # versions with DNS-rebinding protection off by default (<1.23.0).
    "mcp>=1.29,<2.0.0",
    # 3.7.0 adds the opt-in `root_in_active` flag to dump_hierarchy(), which
    # returns only the ACTIVE window's root instead of the whole multi-window
    # tree — a direct size/latency win for dump_ui + extract_ui_graph. 3.5.1
    # also strips BOM/LRM/RLM invisibles from dumped text, which our
    # NFC-normalising text matcher depends on.
    "uiautomator2>=3.7.0",
    "facebook-wda>=1.4.6",
    "pymobiledevice3>=4.0.0",
    # 4.14.1/4.14.2 fix four subprocess bugs that hit us directly — we shell
    # out to adb/xcrun/flutter/patrol constantly: Process.wait() hanging when
    # a grandchild inherits stdout/stderr, aclose() deadlocking on a full
    # pipe buffer, to_process.run_sync() deadlocking on stderr overflow, and
    # CapacityLimiter over-granting tokens.
    "anyio>=4.14.2",
    "pydantic>=2.7.0",
    "pyyaml>=6.0.0",
    # Pillow is also pulled transitively (adbutils, facebook-wda) but we
    # depend on it explicitly because it's our PIL image-cap fallback. If
    # an upstream ever drops it we MUST notice — the cap path silently
    # losing a backend is the exact regression we've been firefighting.
    #
    # Floor 12.3.0: pip-audit flags EIGHT advisories against 12.2.0, all
    # fixed in 12.3.0, several of them heap out-of-bounds writes reachable
    # straight from image data (RankFilter integer overflow, paste()/crop()
    # signed-coordinate overflow, ImageCmsTransform.apply(), attacker-
    # controlled row stride on the mmap path). We push device screenshots
    # through PIL on the cap path, so this is live attack surface.
    "pillow>=12.3.0",
    # Pin urllib3 >= 2.7.0 — CVE-2026-44431 and CVE-2026-44432 are
    # fixed there. Caught by pip-audit in CI; upstream `requests`
    # / `pymobiledevice3` don't bound it tightly, so a fresh install
    # without this pin gets the vulnerable 2.6.3.
    "urllib3>=2.7.0",
]

[project.urls]
Homepage = "https://github.com/michal-giza/flutter-dev-agents"
Repository = "https://github.com/michal-giza/flutter-dev-agents"
Issues = "https://github.com/michal-giza/flutter-dev-agents/issues"
Changelog = "https://github.com/michal-giza/flutter-dev-agents/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    # 9.0.3 carries the CVE-2025-71176 tmpdir fix; the old >=8.0.0 floor
    # admitted vulnerable versions into a fresh CI install.
    "pytest>=9.0.3",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
    "fastapi>=0.110",
    "httpx>=0.27",
]
ar = [
    "opencv-python>=4.9",
    "numpy>=1.26",
]
http = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "httpx>=0.27",
    # Declared explicitly (it arrives transitively via mcp/fastapi) because
    # neither of those bounds it safely. starlette < 1.3.1 carries
    # CVE-2026-48818 (SSRF + NTLM credential theft via UNC paths in
    # StaticFiles), CVE-2026-48817 (arbitrary HTTP method dispatched to
    # HTTPEndpoint attributes via getattr) and CVE-2026-54283 (form() size
    # limits silently ignored for urlencoded bodies → memory-exhaustion
    # DoS). Only the HTTP adapter path is exposed, but that is what this
    # extra ships.
    "starlette>=1.3.1",
    # Same story: arrives transitively behind the FastAPI form parser and
    # is unbounded upstream. < 0.0.31 carries PYSEC-2026-3036 / 3040.
    "python-multipart>=0.0.31",
]
debug = [
    "websockets>=13.0",
]
ios = [
    # Library-side import is enough for our `pymobiledevice3_cli` wrapper.
    # The SUDO-runnable `pymobiledevice3 remote tunneld` daemon needs a
    # system-wide binary (sudo doesn't see the venv PATH). Install
    # separately via `pipx install pymobiledevice3` — see docs/ios_setup.md.
    "pymobiledevice3>=4.0.0",
]
rag = [
    # Vector store (single binary; runs as `docker run -p 6333:6333 qdrant/qdrant`)
    "qdrant-client>=1.9",
    # ONNX-served embeddings — no torch required.
    "fastembed>=0.3",
]

[project.scripts]
mcp-phone-controll = "mcp_phone_controll.__main__:main"
mcp-phone-controll-http = "mcp_phone_controll.adapters.__main__:main"
phone-controll = "mcp_phone_controll.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_phone_controll"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers"
python_classes = "Test"
filterwarnings = ["ignore::pytest.PytestCollectionWarning"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
# Deliberate-style ignores — these flag patterns we use on purpose, not bugs.
ignore = [
    # We use `class Foo(str, Enum)` deliberately for JSON-serialisation
    # compatibility across providers that don't read StrEnum reliably.
    "UP042",
    # Em-dashes, en-dashes and similar Unicode punctuation in docstrings
    # are intentional prose style; ruff flags them as "ambiguous" but
    # they're readable and consistent across the codebase.
    "RUF001",  # ambiguous-unicode-character-string
    "RUF002",  # ambiguous-unicode-character-docstring
    # Pure-style preferences we don't enforce:
    "SIM108",  # if/else → ternary; sometimes the explicit form is clearer
    "SIM103",  # `return bool(x)` is sometimes more readable than `return x`
    "RUF005",  # `[*lst, x]` vs `lst + [x]` is a taste preference
    "RUF007",  # `zip(a, a[1:])` is fine; `itertools.pairwise` is sometimes overkill
    "RUF046",  # int(round(x)) — explicit cast can be clearer than relying on Python 3.x semantics
]

[tool.ruff.lint.per-file-ignores]
# Tests legitimately do deferred imports for skip-conditions and lazy paths.
"tests/**/*.py" = ["E402"]
# Container wires deferred imports inside build_runtime() for optional extras.
"src/mcp_phone_controll/container.py" = ["E402"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["mcp_phone_controll"]
