name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package: [phone-controll]
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh
      - name: Set up Python 3.11
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          cd packages/${{ matrix.package }}
          uv venv --python 3.11
          # `[ar]` brings cv2 — needed by the image-cap test backends.
          # `[dev]` brings ruff + pytest. Skip `[rag,debug,http]` for speed.
          uv pip install -e ".[dev,ar]"
      - name: Run tests
        env:
          MCP_QUIET: "1"
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          cd packages/${{ matrix.package }}
          .venv/bin/pytest -q
      - name: Lint
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          cd packages/${{ matrix.package }}
          .venv/bin/ruff check src tests

  security:
    name: Security audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh
      - name: Set up Python 3.11 + project
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          cd packages/phone-controll
          uv venv --python 3.11
          uv pip install -e ".[dev]" pip-audit cyclonedx-bom

      # ----- CVE scan -----
      # pip-audit hits the OSV.dev + PyPI vulnerability databases.
      # `--skip-editable` excludes our own package (which isn't on
      # PyPI yet). Exit code is non-zero IFF there's at least one
      # un-ignored vulnerability, which is what we want CI to fail on.
      #
      # Excluded vulns (document rationale here; review quarterly):
      # - PYSEC-2022-42969 (`py` 1.11.0): the `py` package is
      #   abandoned upstream with no fix release. We pull it via a
      #   transitive of a transitive (`pytest-forked` -> `py`). The
      #   vulnerability is a ReDoS in `py.path.svnurl` which we
      #   don't use. Re-evaluate when `py` is removed from our tree.
      - name: pip-audit (CVE scan)
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          cd packages/phone-controll
          .venv/bin/pip-audit \
            --progress-spinner=off \
            --skip-editable \
            --ignore-vuln PYSEC-2022-42969

      # ----- SBOM generation -----
      # CycloneDX is the standard SBOM format procurement teams expect.
      # We emit JSON to artifacts; release workflow uploads it alongside
      # the wheel.
      - name: Generate SBOM (CycloneDX)
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          cd packages/phone-controll
          .venv/bin/cyclonedx-py environment .venv --of JSON -o /tmp/sbom.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx-${{ github.sha }}
          path: /tmp/sbom.json
          retention-days: 90

      # ----- Secret scan -----
      # gitleaks catches AWS keys, GitHub tokens, GCP service-account JSON
      # accidentally committed. Runs against the full history on push to
      # main; against the diff on PRs.
      #
      # We invoke the binary directly instead of `gitleaks/gitleaks-action@v2`
      # because that JS action runs on Node 20, which GitHub Actions is
      # deprecating in 2026, and the action has a known "stderr is not
      # empty" crash on the new runners. The binary is a clean shell call
      # with no Node-runtime dependency.
      - name: Install gitleaks
        run: |
          GITLEAKS_VERSION="8.21.2"
          curl -fsSL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            -o /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Secret scan (gitleaks)
        run: |
          # `detect` scans the working tree + git history; `--redact`
          # ensures any finding in CI logs doesn't itself leak the
          # secret. Exit non-zero on findings.
          gitleaks detect \
            --source . \
            --redact \
            --verbose \
            --no-banner \
            --exit-code 1

  docker:
    name: Docker build smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build runtime image
        run: |
          cd packages/phone-controll
          docker build --tag mcp-phone-controll:ci .
      - name: Smoke test — container starts, /health responds
        run: |
          # Drop --rm so we can read logs even if the container dies
          # mid-startup. We stop + remove explicitly at the end.
          # MCP_HTTP_HOST=0.0.0.0 is baked into the image (commit
          # introducing this CI fix), but we set it again here as a
          # belt-and-braces against image-cache staleness.
          docker run -d --name mcp-smoke \
            -e MCP_QUIET=1 \
            -e MCP_HTTP_HOST=0.0.0.0 \
            -p 18765:8765 \
            mcp-phone-controll:ci

          # Wait up to 30s for /health, capturing the last cURL error
          # and the container's stdout/stderr if the loop fails.
          ok=0
          last_err=""
          for i in $(seq 1 30); do
            if last_err=$(curl -fsS http://localhost:18765/health 2>&1 > /dev/null); then
              echo "health ok after ${i}s"
              ok=1
              break
            fi
            sleep 1
          done

          if [ "$ok" != "1" ]; then
            echo "::error::container failed /health after 30s; last cURL: $last_err"
            echo "----- docker ps -a -----"
            docker ps -a --filter name=mcp-smoke
            echo "----- docker logs (last 200 lines) -----"
            docker logs --tail 200 mcp-smoke 2>&1 || true
            echo "----- container inspect (state) -----"
            docker inspect mcp-smoke --format '{{json .State}}' || true
            docker rm -f mcp-smoke || true
            exit 1
          fi

          # Final assertions — both endpoints serve.
          curl -fsS http://localhost:18765/health
          curl -fsS http://localhost:18765/metrics | head -20

          docker stop mcp-smoke
          docker rm -f mcp-smoke || true
